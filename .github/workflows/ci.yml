# CI (docs/spec/08 §5.5). Actions fixadas por SHA (supply chain); o comentário indica a versão.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: consorcio
          POSTGRES_PASSWORD: consorcio
          POSTGRES_DB: consorcio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U consorcio -d consorcio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # 14 SEG-08: app como app_rw, migrações como app_owner (papéis criados por docker/initdb)
      DATABASE_URL: postgresql://app_rw:app_rw@localhost:5432/consorcio
      MIGRATE_DATABASE_URL: postgresql://app_owner:app_owner@localhost:5432/consorcio
      TEST_DATABASE_URL: postgresql://app_rw:app_rw@localhost:5432/consorcio_teste
      TEST_MIGRATE_DATABASE_URL: postgresql://app_owner:app_owner@localhost:5432/consorcio_teste
      APP_URL: http://localhost:3100
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: Papéis do banco
        run: ./docker/initdb/01-papeis.sh
        env:
          PGHOST: localhost
          PGPASSWORD: consorcio
          POSTGRES_USER: consorcio
          POSTGRES_DB: consorcio
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm test:integracao
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          DEV_LOGIN: '1'

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (runner)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: familia-steam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build (migrate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha
      - name: Tamanho da imagem
        run: docker image ls familia-steam:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}' >> "$GITHUB_STEP_SUMMARY"

# Desenvolvimento local.
#   Só o banco (dev com `pnpm dev`):   docker compose up -d db
#   App completo em container:          docker compose --profile app up --build
name: familia-steam

x-db-url: &db-url postgresql://consorcio:consorcio@db:5432/consorcio

services:
  db:
    image: postgres:17-alpine
    # Ajuste para máquina pequena: poucas conexões (pool da app = 5).
    command: postgres -c max_connections=30 -c shared_buffers=64MB
    environment:
      POSTGRES_USER: consorcio
      POSTGRES_PASSWORD: consorcio
      POSTGRES_DB: consorcio
    ports:
      # 5433 no host para não colidir com outros Postgres locais (ajustável por DB_PORTA).
      - '${DB_PORTA:-5433}:5432'
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U consorcio -d consorcio']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db: { condition: service_healthy }

  app:
    profiles: [app]
    build: { context: ., target: runner }
    init: true
    environment:
      DATABASE_URL: *db-url
      APP_URL: http://localhost:3100
    ports:
      - '${APP_PORTA:-3100}:3000'
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  db:

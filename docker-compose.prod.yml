# Produção (08 §8.2, D-29). NÃO usar antes da validação local.
#   cp deploy/.env.prod.example .env.prod   # e preencha os segredos
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: familia-steam-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: postgres -c max_connections=30 -c shared_buffers=64MB
    environment:
      POSTGRES_USER: consorcio
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA}
      POSTGRES_DB: consorcio
      APP_OWNER_SENHA: ${APP_OWNER_SENHA:?defina APP_OWNER_SENHA}
      APP_RW_SENHA: ${APP_RW_SENHA:?defina APP_RW_SENHA}
      CRIAR_BANCO_TESTE: '0'
    volumes:
      - db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U consorcio -d consorcio']
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      MIGRATE_DATABASE_URL: postgresql://app_owner:${APP_OWNER_SENHA}@db:5432/consorcio
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      TZ: UTC
      DATABASE_URL: postgresql://app_rw:${APP_RW_SENHA}@db:5432/consorcio
      APP_URL: ${APP_URL:?defina APP_URL (https://…)}
      STEAM_API_KEY: ${STEAM_API_KEY:?defina STEAM_API_KEY}
      CRON_SECRET: ${CRON_SECRET:?defina CRON_SECRET (≥ 32 caracteres)}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # 08 §7: tick a cada 5 min (laço simples; o tick tem lease próprio contra sobreposição)
  cron:
    image: curlimages/curl:8.16.0
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint:
      - sh
      - -c
      - 'while true; do curl -fsS -m 70 -o /dev/null -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/tick || echo "tick falhou"; sleep 300; done'
    depends_on:
      app: { condition: service_healthy }

  # pg_dump diário, 30 dias de retenção (08 §8.2)
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_SENHA}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ['sh', '-c', 'while true; do sh /backup.sh; sleep 86400; done']
    depends_on:
      db: { condition: service_healthy }

  # HTTPS automático (Let's Encrypt); grava X-Forwarded-For (limite de login por IP)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      app: { condition: service_healthy }

volumes:
  db:
  caddy:

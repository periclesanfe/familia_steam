# pnpm 11: configuração do projeto (não há workspace de múltiplos pacotes).
# Scripts de build de dependências precisam ser aprovados explicitamente.
allowBuilds:
  prisma: true
  '@prisma/engines': true
  esbuild: true
  unrs-resolver: false

# O Next traz o sharp como dependência opcional (otimização de imagem). Usamos images.unoptimized
# (capas e avatares já vêm otimizados do CDN da Steam), então ele fica fora: −18 MB na imagem.
ignoredOptionalDependencies:
  - sharp
# 14 SEG-10: advisories altos em dependências transitivas da CLI do prisma 7.10 (corrigidas upstream)
overrides:
  mysql2: ^3.22.0
  deepmerge-ts: ^8.0.0

# 14 SEG-10: supply chain. minimumReleaseAge 1440 já é o padrão do pnpm 11; explícito para não sumir.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
# Linhas antigas fixadas de propósito, publicadas antes do trusted publishing das versões novas
# (prisma 7.10 × 8 RC; semver 6 × 7; resolver 3 × 4). Revisar ao atualizar cada uma.
trustPolicyExclude:
  - prisma@7.10.0
  - semver@6.3.1
  - eslint-import-resolver-typescript@3.10.1
  # reselect 5.1.1 (reduxjs, dependência do recharts dos gráficos): versão atual, publicada sem
  # atestado de proveniência depois de versões que tinham; conferida em 25/09/2026.
  - reselect@5.1.1
